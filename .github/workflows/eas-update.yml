name: EAS Update CI/CD

on:
  push:
    branches:
      - dev
      - preview
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS branch to update'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - preview
          - production
      environment:
        description: 'EAS environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🚀 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Setup Environment Variables
        run: |
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY || 'AIzaSy_SMART_VAS_DEMO_KEY' }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID || '1:525164210378:web:smartvaswebclient' }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'smart-vas-f312e' }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '525164210378' }}" >> .env

      - name: 🚀 Publish EAS Update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual EAS update trigger' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_BRANCH="${{ inputs.branch }}"
            TARGET_ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_BRANCH="production"
            TARGET_ENV="production"
          elif [ "${{ github.ref_name }}" = "preview" ]; then
            TARGET_BRANCH="preview"
            TARGET_ENV="preview"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TARGET_BRANCH="dev"
            TARGET_ENV="development"
          else
            echo "Branch ${{ github.ref_name }} is not configured for auto-update."
            exit 1
          fi

          echo "Publishing EAS Update to branch: $TARGET_BRANCH (environment: $TARGET_ENV)..."
          npx eas-cli update --branch "$TARGET_BRANCH" --environment "$TARGET_ENV" --message "$COMMIT_MESSAGE" --non-interactive
